* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; height: 100%; overflow: hidden; color: var(--ink); font-family: var(--sans); }
#viewport { position: fixed; inset: 0; display: grid; place-items: center; }
#stage { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--ground); transform-origin: 0 0; }
#bg { position: absolute; inset: 0; }
.grain { position: absolute; inset: -50%; pointer-events: none; opacity: .07; mix-blend-mode: overlay;

.vignette { position: absolute; inset: 0; pointer-events: none; background: radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(0,4,10,.75) 100%); }
#sweep { position: absolute; left: 0; right: 0; height: 2px; background: var(--accent); box-shadow: 0 0 24px 6px rgba(80,230,255,.55), 0 0 90px 20px rgba(80,230,255,.18); opacity: 0; }
#flash { position: absolute; inset: 0; background: radial-gradient(circle at 50% 50%, rgba(139,240,255,.55), rgba(80,230,255,0) 60%); opacity: 0; pointer-events: none; mix-blend-mode: screen; }
#black { position: absolute; inset: 0; background: #000; opacity: 0; pointer-events: none; }

.scene { position: absolute; inset: 0; display: none; will-change: opacity, transform; }
.abs { position: absolute; }
.mono { font-family: var(--mono); }
.eyebrow { font: 700 20px/1 var(--sans); letter-spacing: .18em; text-transform: uppercase; color: var(--accent); }
.h1 { font: 700 84px/1.05 var(--display); letter-spacing: -.02em; }
.h2 { font: 700 60px/1.1 var(--display); letter-spacing: -.015em; }
.lead { font: 500 30px/1.4 var(--sans); color: var(--ink-muted); }
.muted { color: var(--ink-muted); } .subtle { color: var(--ink-subtle); }
.accent { color: var(--accent); } .danger { color: var(--danger); } .warning { color: var(--warning); } .success { color: var(--success); }
.card { background: linear-gradient(180deg, rgba(10,42,67,.92), rgba(7,29,51,.94)); border: 1px solid var(--border); border-radius: 20px; box-shadow: var(--elev-card), var(--inset-edge); }

.label { font: 700 15px/1 var(--sans); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-subtle); }
svg.i { display: inline-block; vertical-align: middle; flex: none; }

.badge { display: inline-flex; align-items: center; gap: .45em; padding: .38em .85em .38em .7em; border-radius: 999px; border: 1.5px solid currentColor;
  font: 800 1em/1 var(--sans); letter-spacing: .06em; text-transform: uppercase; white-space: nowrap; }
.badge svg { width: 1.05em; height: 1.05em; }
.b-mal { color: var(--danger); background: var(--danger-bg); }
.b-sus { color: var(--warning); background: var(--warning-bg); }
.b-unk { color: var(--info); background: var(--info-bg); }
.b-cln { color: var(--success); background: var(--success-bg); }

.cursor { position: absolute; left: 0; top: 0; width: 34px; height: 34px; filter: drop-shadow(0 4px 10px rgba(0,0,0,.6)); z-index: 50; }
.ripple { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 3px solid var(--accent); opacity: 0; z-index: 49; }

.row .hot-r { color: var(--danger); } .row .hot-c { color: var(--accent); }
.kin { position: absolute; left: 0; right: 0; text-align: center; font: 800 132px/1 var(--display); letter-spacing: -.035em; text-shadow: 0 10px 60px rgba(0,0,0,.8); }

.tile { position: absolute; padding: 26px 30px; }

#controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 14px; align-items: center; padding: 12px 18px; background: rgba(2,10,20,.85); font: 600 14px/1 var(--mono); color: var(--ink-muted); z-index: 10; }
#controls button { background: var(--accent); color: var(--on-accent); border: 0; border-radius: 999px; padding: 8px 16px; font: 800 14px/1 var(--sans); cursor: pointer; }
#controls input { flex: 1; accent-color: #50e6ff; }
body.render #controls { display: none; }

    st.style.background = held ? 'var(--accent-soft)' : 'transparent';
    $('dlcard').style.borderColor = held ? 'rgba(80,230,255,.6)' : '';
    $('dlcard').style.boxShadow = held ? 'var(--elev-card), var(--glow-md)' : '';
    $('dlicon').style.color = held ? 'var(--accent)' : 'var(--ink)';
    let h = '';
    if (t > 42.5) for (let i = 0; i < 8; i++) { const ph = ((t - 42.5) * 1.2 + i / 8) % 1; h += `<div style="position:absolute;left:${ph * 236}px;top:-3px;width:10px;height:10px;border-radius:50%;background:#50e6ff;box-shadow:0 0 12px #50e6ff;opacity:${Math.sin(ph * 3.14)}"></div>`; }
    $('flow').innerHTML = h;
  }
  // S7 chips split, brand glows
  if (t > 46 && t < 60.5) {
    const kc = E.io(P(t, 47.5, 48.4));
    const ca = P(t, 46.9, 47.2) * (1 - P(t, 48.3, 48.5));
    tf($('chipA'), { o: ca, x: lerp(0, -440, kc), y: lerp(0, 160, kc), s: lerp(1, .7, kc) });
    tf($('chipB'), { o: ca, x: lerp(0, 440, kc), y: lerp(0, 160, kc), s: lerp(1, .7, kc) });
    document.querySelectorAll('#s7 .brandname').forEach(b => {
      const a = +b.dataset.glow, k = P(t, a, a + .3) * (1 - P(t, a + 1.8, a + 2.4) * .6);
      b.style.color = k > .05 ? `color-mix(in srgb, #50e6ff ${k * 100}%, #e6f3fb)` : '';
      b.style.textShadow = k > .05 ? `0 0 ${24 * k}px rgba(80,230,255,${.7 * k})` : '';
    });
    const nf = Math.max(0, 1 - Math.abs(t - 53.3) * 1.6);
    document.querySelectorAll('#s7 .netoff').forEach(n => n.style.boxShadow = nf ? `0 0 ${30 * nf}px rgba(255,107,128,${nf})` : '');
    ['pA', 'pB'].forEach((id, i) => { const vt = i ? 57.4 : 55.6; const k = Math.max(0, 1 - Math.abs(t - vt - .3) * 1.2); $(id).style.borderColor = k > .02 ? `rgba(255,107,128,${.3 + .6 * k})` : ''; });
  }
  // S8 merge + ladder
  if (t > 59.5 && t < 67.5) {
    const m = E.in(P(t, 60.6, 61.2));
    const vis = 1 - P(t, 61.15, 61.25);
    tf($('cA'), { o: P(t, 60.0, 60.3) * vis, x: lerp(0, 215, m), y: 0 });
    tf($('cB'), { o: P(t, 60.0, 60.3) * vis, x: lerp(0, -215, m), y: 0 });
    const ag = E.back(P(t, 61.2, 61.7));
    tf($('agree'), { o: P(t, 61.2, 61.4), s: .85 + .15 * ag });
    flash.style.opacity = Math.max(0, .6 - Math.abs(t - 61.25) * 2.5);
    tf($('mkRules'), { o: P(t, 62.6, 62.9) * (1 - .5 * P(t, 64.2, 64.6)), x: -20 * (1 - P(t, 62.6, 62.9)) });
    const lift = E.io(P(t, 63.4, 64.4));
    $('liftbar').style.height = (lift * 112) + 'px';
    $('liftbar').style.top = (96 + 112 - lift * 112 + 8) + 'px';
    tf($('mkAI'), { o: P(t, 63.4, 63.6), y: lerp(112, 0, lift) });
    tf($('never2'), { o: P(t, 65.0, 65.4), x: -20 * (1 - P(t, 65.0, 65.4)) });
  }
  // S9 code highlights + slow push
  if (t > 66.5 && t < 75) {
    document.querySelectorAll('#s9 .cl[data-hl]').forEach(l => {
      const a = +l.dataset.hl, k = E.out(P(t, a, a + .5));
      l.querySelector('.hlb').style.transform = `scaleX(${k})`;
      l.style.borderLeftColor = k > .05 ? 'var(--danger)' : 'transparent';
      l.style.color = k > .5 ? '#ffd0d7' : '';
      const tag = l.querySelector('.tag'); if (tag) tf(tag, { o: P(t, a + .2, a + .4), s: .5 + .5 * E.back(P(t, a + .2, a + .5)) });
    });
    const z = E.io(P(t, 67, 74.5));
    $('rep').style.transform = `scale(${1 + .035 * z}) translate(${-12 * z}px, ${-6 * z}px)`;
  }
  // S10 typing indicator
  if (t > 74 && t < 81.5) {
    const ty = $('typing'); ty.style.opacity = t > 76.2 && t < 77.3 ? 1 : 0;
    ty.querySelectorAll('.tdot').forEach((d, i) => { d.style.cssText = `display:inline-block;width:12px;height:12px;border-radius:50%;background:#9aa7b3;opacity:${.35 + .65 * Math.max(0, Math.sin(t * 8 - i * .9))}`; });
  }
  // S11 ring, fn key, mini panel
  if (t > 80.5 && t < 87.5) {
    const C = 2 * Math.PI * 125, k = E.expo(P(t, 81.6, 83.2)) * .92;
    $('ring').style.strokeDasharray = `${C * k} ${C}`;
    const press = t > 81.45 && t < 81.65;
    $('fnkey').style.transform = press ? 'translateY(6px)' : '';
    $('fnkey').style.boxShadow = press ? '0 2px 0 #0a121b, 0 0 30px rgba(80,230,255,.6)' : '';
    $('fnkey').style.borderColor = t > 81.45 ? 'var(--accent)' : '';
    const mk = E.back(P(t, 81.7, 82.2));
    tf($('mini'), { o: P(t, 81.7, 81.9), y: -30 * (1 - mk), s: .94 + .06 * mk });
    $('mini').style.transformOrigin = '85% 0';
    $('dash').style.filter = t > 81.7 ? `brightness(${1 - .25 * P(t, 81.7, 82.2)})` : '';
    $('mbshield').style.filter = t > 81.5 && t < 82.3 ? 'drop-shadow(0 0 8px #50e6ff)' : '';
  }
  // S12 outro
  if (t > 86.5) {
    drawShield(SH2, t, 87.1);
    tf($('s12shield'), { o: P(t, 87.0, 87.2), s: .9 + .1 * E.out(P(t, 87, 88)) });
    rings($('rings2'), t, 88.3, 91, 690, 410, 1.3);
    black.style.opacity = E.io(P(t, 94.6, 96));
  }
}

function scenesVisibility(t) {
  for (const s of S) {
    const vis = t >= s.s - .3 && t <= s.e + .3;
    s.el.style.display = vis ? 'block' : 'none';
    if (!vis) continue;
    const inK = s.s === 0 ? 1 : E.out(P(t, s.s - .1, s.s + .45));
    const outK = s.e >= DUR ? 0 : P(t, s.e - .3, s.e + .2);
    tf(s.el, { o: inK * (1 - outK), s: (1.04 - .04 * inK) * (1 - .05 * outK), b: 12 * outK + 8 * (1 - inK) });
  }
  // scan sweep at each boundary
  let sw = null;
  for (const b of BOUNDS) if (t > b - .3 && t < b + .3) sw = b;
  if (sw != null) { const k = P(t, sw - .3, sw + .3); sweep.style.top = (k * 1080) + 'px'; sweep.style.opacity = Math.sin(k * Math.PI); } else sweep.style.opacity = 0;
}

function render(t) {
  t = clamp(t, 0, DUR);
  drawBg(t);
  scenesVisibility(t);
  entrances(t);
  counters(t);
  scenes(t);
}

window.__seek = t => new Promise(res => { render(t); requestAnimationFrame(() => requestAnimationFrame(res)); });
window.__duration = DUR;

/* preview player */
const isRender = new URLSearchParams(location.search).has('render');
if (isRender) document.body.classList.add('render');
function fit() {
  if (isRender) { stage.style.transform = ''; return; }
  const s = Math.min(innerWidth / 1920, (innerHeight - 50) / 1080);
  stage.style.transform = `scale(${s})`;
  stage.style.left = (innerWidth - 1920 * s) / 2 + 'px';
  stage.style.top = (innerHeight - 50 - 1080 * s) / 2 + 'px';
}
addEventListener('resize', fit); fit();
const audio = $('audio'), playBtn = $('play'), scrub = $('scrub'), clock = $('clock');
let playing = false, t0 = 0, base = 0, cur = +(new URLSearchParams(location.search).get('t') || 0);
function loop(now) {
  if (!playing) return;
  cur = base + (now - t0) / 1000;
  if (cur >= DUR) { cur = DUR; playing = false; playBtn.textContent = 'Play'; }
  render(cur); scrub.value = cur; clock.textContent = cur.toFixed(2);
  requestAnimationFrame(loop);
}
function play() { if (cur >= DUR) cur = 0; playing = true; base = cur; t0 = performance.now(); playBtn.textContent = 'Pause'; try { audio.currentTime = cur; audio.play().catch(() => {}); } catch {} requestAnimationFrame(loop); }
function pause() { playing = false; playBtn.textContent = 'Play'; try { audio.pause(); } catch {} }
playBtn.onclick = () => playing ? pause() : play();
scrub.oninput = () => { pause(); cur = +scrub.value; render(cur); clock.textContent = cur.toFixed(2); };
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); playing ? pause() : play(); } });
document.fonts.ready.then(() => render(cur));
</script>
