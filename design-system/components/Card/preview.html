<!-- @dsCard group="Surfaces" height=280 subtitle="The panel every dashboard view is built from" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'grid', style:{gridTemplateColumns:'1fr 1fr'}},
      h(A.Card, {eyebrow:'Perimeter', title:'Firewall policy', description:'Edge rules evaluated in the last hour.',
        action: h(A.Button, {variant:'ghost', size:'sm'}, 'Edit')},
        h(A.Meter, {label:'Rules matched', value:72, display:'1,284'})),
      h(A.Card, {highlight:true, eyebrow:'Needs attention', title:'Credential exposure',
        action: h(A.SeverityBadge, {level:'critical'})},
        h('p', {style:{margin:0,fontSize:'13px',lineHeight:'19px',color:'var(--ink-muted)'}},
          'Three service accounts are using keys older than the 90-day rotation window.'))
    ));

</script>
</body>
</html>
