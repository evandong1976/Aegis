<!-- @dsCard group="Data" height=320 subtitle="Detections, newest first" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  var cols = [
    {key:'verdict', header:'Verdict'},
    {key:'what', header:'URL or file', mono:true},
    {key:'why', header:'Reason', nowrap:true},
    {key:'who', header:'User', nowrap:true},
    {key:'time', header:'Scanned', align:'right', mono:true}
  ];
  var rows = [
    {verdict:h(A.SeverityBadge,{level:'critical'},'Malicious'), what:'login-northwlnd-io.sbs/sso', why:'Brand impersonation', who:'d.okafor', time:'14:02:11'},
    {verdict:h(A.SeverityBadge,{level:'critical'},'Malicious'), what:'invoice_oct.iso', why:'Sandbox detonation', who:'a.silva', time:'13:58:40'},
    {verdict:h(A.SeverityBadge,{level:'high'},'Suspicious'), what:'cdn-assets-delivery.top/pkg.js', why:'Obfuscated script', who:'m.haddad', time:'13:47:50'},
    {verdict:h(A.SeverityBadge,{level:'secure'},'Clean'), what:'docs.vendor.com/api/auth', why:'Known good', who:'d.okafor', time:'13:12:27'}
  ];
  ReactDOM.createRoot(document.getElementById('root')).render(h(A.ThreatTable, {columns:cols, rows:rows}));

</script>
</body>
</html>
