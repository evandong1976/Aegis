<!-- @dsCard group="Forms" height=280 subtitle="Label, hint, error" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'grid', style:{gridTemplateColumns:'1fr 1fr', alignItems:'start'}},
      h(A.Field, {label:'Workspace name', defaultValue:'Northwind SOC', hint:'Shown on every exported report.'}),
      h(A.Field, {label:'API key', icon:'key', defaultValue:'ak_live_8f2c', error:'This key was revoked on 4 Oct.'}),
      h(A.Field, {label:'Allowed CIDR range', icon:'globe', placeholder:'10.0.0.0/16'}),
      h(A.Field, {label:'Retention', defaultValue:'90 days', disabled:true, hint:'Set by your plan.'})
    ));

</script>
</body>
</html>
