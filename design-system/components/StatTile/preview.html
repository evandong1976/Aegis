<!-- @dsCard group="Data" height=200 subtitle="Headline metric with delta and sparkline" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'grid', style:{gridTemplateColumns:'repeat(3, 1fr)'}},
      h(A.StatTile, {label:'Links scanned', value:'24,118', icon:'globe', delta:'9%',
        direction:'up', intent:'good', caption:'vs. yesterday', points:[12,14,13,18,16,21,19,24]}),
      h(A.StatTile, {label:'Median verdict time', value:'1.2', unit:'s', icon:'activity',
        delta:'0.3 s', direction:'down', intent:'bad', caption:'faster'}),
      h(A.StatTile, {label:'Files quarantined', value:'37', icon:'lock', delta:'6',
        direction:'up', intent:'bad', caption:'awaiting review', points:[2,3,5,4,6,5,7,9]})
    ));

</script>
</body>
</html>
