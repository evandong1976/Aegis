<!-- @dsCard group="Data" height=200 subtitle="Headline metric with delta and sparkline" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'grid', style:{gridTemplateColumns:'repeat(3, 1fr)'}},
      h(A.StatTile, {label:'Threats blocked', value:'8,412', icon:'shield-check', delta:'12%',
        direction:'up', intent:'good', caption:'vs. last week', points:[4,6,5,9,7,12,10,14]}),
      h(A.StatTile, {label:'Mean time to respond', value:'14', unit:'min', icon:'activity',
        delta:'3 min', direction:'down', intent:'bad', caption:'faster'}),
      h(A.StatTile, {label:'Assets unmonitored', value:'23', icon:'database', delta:'5',
        direction:'up', intent:'bad', caption:'new this week', points:[9,8,10,12,11,15,18,23]})
    ));

</script>
</body>
</html>
