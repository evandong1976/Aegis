<!-- @dsCard group="Surfaces" height=300 subtitle="Nothing found, and nothing wrong" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h(A.Card, null,
      h(A.EmptyState, {icon:'radar', title:'No active threats',
        description:'Every detection in this window has been resolved or suppressed. The next sweep runs at 02:00 UTC.',
        action:h(A.Button,{variant:'secondary',icon:'scan'},'Run a scan now')})
    ));

</script>
</body>
</html>
