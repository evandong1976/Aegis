<!-- @dsCard group="Status" height=380 subtitle="Four tones, each with an icon and a word" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'col'},
      h(A.AlertBanner, {tone:'critical', title:'Phishing campaign targeting 14 people',
        action:h(A.Button,{variant:'danger',size:'sm'},'Block domain')},
        'Fourteen mails since 13:40 carry links to login-northwlnd-io.sbs, registered two days ago.'),
      h(A.AlertBanner, {tone:'warning', title:'Chat links are only scanned in one of three workspaces'},
        'Links shared in the other two reach people unscanned.'),
      h(A.AlertBanner, {tone:'info', title:'Sandbox maintenance at 02:00 UTC'},
        'Archives are delivered without detonation for roughly twenty minutes.'),
      h(A.AlertBanner, {tone:'success', title:'Nothing is waiting for review'},
        'The last held link was released 40 minutes ago.')
    ));

</script>
</body>
</html>
