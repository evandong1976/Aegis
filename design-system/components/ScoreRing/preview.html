<!-- @dsCard group="Data" height=240 subtitle="Posture score, 0–100" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'row', style:{gap:'var(--space-10)'}},
      h(A.ScoreRing, {value:86, label:'Posture'}),
      h(A.ScoreRing, {value:42, label:'Cloud', size:132, strokeWidth:10}),
      h(A.ScoreRing, {value:97, label:'Identity', size:104, strokeWidth:8})
    ));

</script>
</body>
</html>
