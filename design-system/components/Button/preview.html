<!-- @dsCard group="Actions" height=160 subtitle="Four variants, three sizes" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'col'},
      h('div', {className:'row'},
        h(A.Button, {variant:'primary', icon:'shield-check'}, 'Run scan'),
        h(A.Button, {variant:'secondary', icon:'file-search'}, 'View report'),
        h(A.Button, {variant:'ghost', icon:'settings'}, 'Configure'),
        h(A.Button, {variant:'danger', icon:'wifi-off'}, 'Isolate host')
      ),
      h('div', {className:'row'},
        h(A.Button, {size:'sm', variant:'primary'}, 'Small'),
        h(A.Button, {size:'md', variant:'primary'}, 'Medium'),
        h(A.Button, {size:'lg', variant:'primary', iconEnd:'arrow'}, 'Large'),
        h(A.Button, {variant:'secondary', disabled:true}, 'Disabled')
      )
    ));

</script>
</body>
</html>
