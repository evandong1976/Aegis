<!-- @dsCard group="Data" height=200 subtitle="Coverage and utilisation bars" -->
<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  ReactDOM.createRoot(document.getElementById('root')).render(
    h('div', {className:'col', style:{maxWidth:'460px'}},
      h(A.Meter, {label:'Endpoint agent coverage', value:94, display:'94%', tone:'success'}),
      h(A.Meter, {label:'MFA enrolment', value:68, display:'68%'}),
      h(A.Meter, {label:'Patch compliance', value:41, display:'41%', tone:'warning'}),
      h(A.Meter, {label:'Legacy TLS in use', value:12, display:'12 hosts', tone:'danger'})
    ));

</script>
</body>
</html>
