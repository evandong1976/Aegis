<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Aegis preview</title>
<style>
  html,body{margin:0;}
  body{background:var(--ground);color:var(--ink);font-family:var(--font-sans);padding:var(--space-6);box-sizing:border-box;}
  .row{display:flex;flex-wrap:wrap;align-items:center;gap:var(--space-3);}
  .col{display:flex;flex-direction:column;gap:var(--space-4);}
  .grid{display:grid;gap:var(--space-5);}
  
</style></head>
<body>
<div id="root"></div>
<script>
  var A = window.Aegis, h = React.createElement, F = React.Fragment;

  function Demo() {
    var s = React.useState('open'), v = s[0], set = s[1];
    return h('div', {className:'col'},
      h(A.Tabs, {value:v, onChange:set, items:[
        {label:'Open', value:'open', count:12},
        {label:'Investigating', value:'inv', count:4},
        {label:'Resolved', value:'res', count:318},
        {label:'Suppressed', value:'sup'}
      ]}));
  }
  ReactDOM.createRoot(document.getElementById('root')).render(h(Demo));

</script>
</body>
</html>
