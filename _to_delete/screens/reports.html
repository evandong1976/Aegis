<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — Reports</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="../design-system/components/bundle.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var A = window.Aegis, S = window.Shell, h = React.createElement, F = React.Fragment;

  var rows = [
    ['Executive summary','Oct 2026','PDF','D. Okafor','14 Oct 09:00'],
    ['Vulnerability detail','W41','CSV','Automation','13 Oct 02:00'],
    ['Identity posture','Q3','PDF','M. Haddad','01 Oct 17:20'],
    ['Incident 2026-0914','One-off','PDF','D. Okafor','14 Sep 22:41']
  ].map(function (r) {
    return {name:r[0], period:r[1], format:r[2], who:r[3], when:r[4],
      get:h(A.Button,{variant:'ghost', size:'sm', icon:'file-search'},'Open')};
  });
  var cols = [
    {key:'name', header:'Report', nowrap:true}, {key:'period', header:'Period'}, {key:'format', header:'Format'},
    {key:'who', header:'Generated by'}, {key:'when', header:'Generated', mono:true}, {key:'get', header:'', align:'right'}
  ];
  function Tile(p) {
    return h('button', {className:'tile-link', type:'button'},
      h('span', {className:'tile-link__icon'}, h(A.Icon, {name:p.icon, size:20})),
      h('p', {className:'tile-link__title'}, p.title),
      h('p', {className:'tile-link__text'}, p.text));
  }

  S.mount(h(S.Shell, {page:'reports', eyebrow:'Reports', title:'Evidence and exports'},
    h(A.Card, {title:'Start a report', description:'Every report is generated from the same evidence the dashboard shows.'},
      h('div', {className:'grid grid--4'},
        h(Tile, {icon:'shield-check', title:'Executive summary', text:'Posture, incidents and trend for a board audience.'}),
        h(Tile, {icon:'bug', title:'Vulnerability detail', text:'Every open finding with affected assets and remediation.'}),
        h(Tile, {icon:'users', title:'Identity posture', text:'MFA, privileged access and dormant accounts.'}),
        h(Tile, {icon:'file-search', title:'Incident record', text:'Timeline, evidence and actions for one incident.'})
      )),
    h('div', {className:'grid grid--split'},
      h(A.Card, {title:'Generated reports',
        action: h(A.Button, {variant:'secondary', size:'sm', icon:'file-search'}, 'Export all')},
        h(A.ThreatTable, {columns:cols, rows:rows})),
      h(A.Card, {title:'Scheduled'},
        h(A.EmptyState, {icon:'bell', title:'No report due today',
          description:'The weekly executive summary is generated every Monday at 09:00 UTC. The next one runs in 3 days.',
          action: h(A.Button, {variant:'secondary', size:'sm', icon:'settings'}, 'Edit schedule')}))
    )
  ));

})();
</script>
</body>
</html>
