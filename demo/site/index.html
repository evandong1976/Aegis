<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Meeting app update</title>
    <style>
      :root {
        color-scheme: light dark;
        --bg: #f4f5f7;
        --card: #ffffff;
        --text: #1d2330;
        --muted: #5b6475;
        --accent: #2d6cdf;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14171d;
          --card: #1d222b;
          --text: #e8ebf0;
          --muted: #9aa3b2;
          --accent: #5b8ff0;
        }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font:
          16px/1.5 system-ui,
          -apple-system,
          sans-serif;
      }
      main {
        max-width: 420px;
        margin: 16px;
        padding: 32px;
        border-radius: 12px;
        background: var(--card);
        box-shadow: 0 2px 12px rgb(0 0 0 / 0.08);
      }
      h1 {
        margin: 0 0 8px;
        font-size: 22px;
      }
      p {
        margin: 0 0 24px;
        color: var(--muted);
      }
      a.button {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 8px;
        background: var(--accent);
        color: #fff;
        font-weight: 600;
        text-decoration: none;
      }
      footer {
        margin-top: 24px;
        font-size: 12px;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Your meeting app needs an update</h1>
      <p>Version 6.4.1 fixes audio problems. Download and open the update to continue.</p>
      <a class="button" href="/download/ZoomUpdate.zip" download>Download update</a>
      <footer>Aegis demo page, served from this Mac only. The download is harmless.</footer>
    </main>
  </body>
</html>
