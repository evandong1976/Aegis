<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Aegis — Downloads</title>
<link rel="stylesheet" href="../design-system/tokens.css">
<link rel="stylesheet" href="../design-system/components/bundle.css">
<link rel="stylesheet" href="app.css">
<script src="vendor/react.js"></script>
<script src="vendor/react-dom.js"></script>
<script src="../design-system/components/bundle.js"></script>
<script src="shell.js"></script>
</head>
<body>
<div id="root"></div>
<script>
(function () {
  var A = window.Aegis, S = window.Shell, h = React.createElement, F = React.Fragment, V = window.Shell.Verdict;

  var rows = [
    ['malicious','invoice_oct.iso','Disc image','4.2 MB','a.silva','13:58:40','Quarantined'],
    ['malicious','setup_v2.scr','Executable','1.1 MB','k.novak','13:51:14','Quarantined'],
    ['suspicious','Q3-summary.xlsm','Spreadsheet','284 KB','r.chen','13:31:02','Held'],
    ['suspicious','drivers.zip','Archive','18.6 MB','m.haddad','13:22:47','Detonating'],
    ['unknown','vendor-sdk.pkg','Installer','42.1 MB','d.okafor','13:09:33','Held'],
    ['clean','brand-assets.zip','Archive','9.4 MB','m.haddad','12:55:08','Delivered']
  ].map(function (r) {
    return {verdict:h(V,{verdict:r[0]}), file:r[1], kind:r[2], size:r[3], who:r[4], time:r[5], action:r[6]};
  });
  var cols = [
    {key:'verdict', header:'Verdict'}, {key:'file', header:'File', mono:true},
    {key:'kind', header:'Kind', nowrap:true}, {key:'size', header:'Size', align:'right', mono:true},
    {key:'who', header:'User', nowrap:true},
    {key:'time', header:'Scanned', mono:true}, {key:'action', header:'Action', align:'right', nowrap:true}
  ];

  function Page() {
    var s = React.useState('quar'), tab = s[0], setTab = s[1];
    return h(S.Shell, {page:'downloads', eyebrow:'Downloads', title:'File verdicts'},
      h('div', {className:'grid grid--4'},
        h(A.StatTile, {label:'Files scanned', value:'1,840', icon:'file-search', delta:'4%', direction:'up', intent:'good', caption:'vs. yesterday'}),
        h(A.StatTile, {label:'Quarantined', value:'37', icon:'lock', delta:'6', direction:'up', intent:'bad', caption:'awaiting review'}),
        h(A.StatTile, {label:'Blocked by policy', value:'12', icon:'x', caption:'blocked file types'}),
        h(A.StatTile, {label:'Detonated', value:'9', icon:'scan', caption:'archives, median 38 s'})
      ),
      h(A.Card, {title:'Downloaded files', description:'A quarantined file never reaches the device; the user sees why.',
        action: h(A.Button, {variant:'secondary', size:'sm', icon:'file-search'}, 'Export')},
        h('div', {className:'stack'},
          h('div', {className:'row row--between'},
            h(A.Tabs, {value:tab, onChange:setTab, items:[
              {label:'Quarantined', value:'quar', count:37},
              {label:'Held', value:'held', count:14},
              {label:'Delivered', value:'ok'},
              {label:'All', value:'all'}
            ]}),
            h('div', {style:{width:'280px'}}, h(A.SearchField, {placeholder:'Filter by file, hash or user'}))
          ),
          h(A.ThreatTable, {columns:cols, rows:rows}))),
      h('div', {className:'grid grid--2'},
        h(A.Card, {title:'What caught them', description:'Which engine returned the verdict.'},
          h('div', {className:'stack'},
            h(A.Meter, {label:'Sandbox detonation', value:44, display:'16 files', tone:'danger'}),
            h(A.Meter, {label:'Static signatures', value:31, display:'11 files'}),
            h(A.Meter, {label:'Reputation', value:17, display:'6 files'}),
            h(A.Meter, {label:'Macro analysis', value:8, display:'3 files', tone:'warning'}))),
        h(A.Card, {title:'By file type', description:'Everything scanned today.'},
          h(S.Bars, {max:700, columns:[
            {label:'Archive', segments:[{token:'chart-1', value:612, label:'Archive'}]},
            {label:'Document', segments:[{token:'chart-4', value:498, label:'Document'}]},
            {label:'Image', segments:[{token:'chart-5', value:518, label:'Image'}]},
            {label:'Installer', segments:[{token:'chart-2', value:212, label:'Installer'}]}
          ]})))
    );
  }
  S.mount(h(Page));

})();
</script>
</body>
</html>
